name: harmonia_ai
description: Harmonia AI - an AI-powered wellness and productivity platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.3
  firebase_ai: ^2.0.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.2
  lottie: ^3.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  camera: ^0.11.0+2
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  google_mlkit_pose_detection: ^0.13.0
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.12.1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/models/
  fonts:
    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-Light.ttf
          weight: 300
        - asset: assets/fonts/JosefinSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
